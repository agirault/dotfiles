# --- Basics ---

# Enable mouse support (scroll, click to select pane, resize panes by dragging)
set -g mouse on

# Start window/pane numbering at 1 (0 is far from the other keys)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Keep window names fixed (don't auto-rename based on running process or escape
# sequences from the shell) - so names set by `tm` stick, which iTerm2 then
# picks up as the tab title in -CC mode.
setw -g automatic-rename off
set -g allow-rename off

# Size each window to the largest attached client, rather than the smallest
# (default). Avoids void space on big monitors when a smaller client (e.g. the
# -CC control window) is also attached.
set -g window-size largest

# Must stay off - iTerm2's -CC integration rejects aggressive-resize.
setw -g aggressive-resize off

# Increase scrollback buffer
set -g history-limit 50000

# Faster escape key (default 500ms is sluggish)
set -sg escape-time 10

# Enable 256 colors
set -g default-terminal "tmux-256color"

# Clipboard: use OSC 52 to send yanked text to the Mac clipboard via iTerm2
set -g set-clipboard on

# Allow escape sequences (e.g. OSC 9 notifications) to pass through to iTerm2
set -g allow-passthrough on

# Forward terminal focus-gained/lost events to programs inside tmux
# (lets apps tell whether the pane is actually being watched)
set -g focus-events on

# Monitor bells in non-active windows (highlights them in status bar)
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# --- Keybindings ---

# Prefix: Ctrl-a (easier to reach than default Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes: | or \ for vertical, - or _ for horizontal
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# New windows open in the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Status bar ---

# Clean, minimal status bar
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[fg=colour214,bold] #S "
set -g status-right "#[fg=colour248] %H:%M "
set -g status-left-length 30
setw -g window-status-current-style "fg=colour214,bold"
