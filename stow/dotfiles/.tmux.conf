# --- Basics ---

# Enable mouse support (scroll, click to select pane, resize panes by dragging)
set -g mouse on

# Start window/pane numbering at 1 (0 is far from the other keys)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Keep window names fixed (don't auto-rename based on running process or escape
# sequences from the shell), so the names that `tm` sets stay visible in the
# status bar.
setw -g automatic-rename off
set -g allow-rename off

# Size each window to the client with the most recent activity. This lets
# windows follow the terminal currently in use when moving between displays.
set -g window-size latest

# Increase scrollback buffer
set -g history-limit 50000

# Faster escape key (default 500ms is sluggish)
set -sg escape-time 10

# Enable 256 colors
set -g default-terminal "tmux-256color"

# Clipboard: use OSC 52 to send yanked text to the terminal's clipboard. This
# also works over SSH, because the escape sequence travels through the
# terminal connection.
set -g set-clipboard on

# Let escape sequences from programs inside a pane (for example OSC 9 desktop
# notifications) reach the terminal.
set -g allow-passthrough on

# Forward terminal focus-gained/lost events to programs inside tmux
# (lets apps tell whether the pane is actually being watched)
set -g focus-events on

# Monitor bells in non-active windows (highlights them in status bar)
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# --- Keybindings ---

# Prefix: Ctrl-a (easier to reach than default Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes: | or \ for vertical, - or _ for horizontal
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# New windows open in the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Status bar ---

# Clean, minimal status bar
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[fg=colour214,bold] #S "
set -g status-right "#[fg=colour248] %H:%M "
set -g status-left-length 30
setw -g window-status-current-style "fg=colour214,bold"

# No plugins. Sessions are created on demand with `tm`, so there is nothing
# worth saving across reboots.
