# Shared environment configuration
# Parsed by env_loader.fish (fish) and 00-env-loader.sh (bash)
# Sections:
#   [prepend] KEY=value   prepend to colon-separated var (multiple entries ok)
#   [export]  KEY=value   always set and export
#   [default] KEY=value   export only if unset or empty (honors parent env)
#   [alias]   name=command

[prepend]
PATH=/usr/local/cuda/bin
PATH=$HOME/.local/bin

[export]
GPG_TTY=$(tty)
SSH_AUTH_SOCK=$HOME/.ssh/ssh_auth_sock

[default]
COLORTERM=truecolor

[alias]
cu=cursor-agent
claude=env GIT_CONFIG_GLOBAL=$HOME/.gitconfig.local claude
cl=claude
cls=claude-sessions
clr=claude --resume
clp=claude --prompt --model haiku
py=python
py3=python3
pym=python -m
pyc=python -c
tml=tm -l
