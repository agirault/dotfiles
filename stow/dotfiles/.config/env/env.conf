# Shared environment configuration
# Parsed by env_loader.fish (fish) and 00-env-loader.sh (bash)
# Sections:
#   [prepend] KEY=value   prepend to colon-separated var (multiple entries ok)
#   [export]  KEY=value   always set and export
#   [default] KEY=value   export only if unset or empty (honors parent env)
#   [alias]   name=command

[prepend]
PATH=/usr/local/cuda/bin
PATH=$HOME/.local/bin
PATH=$HOME/.pixi/bin
# Homebrew on Apple Silicon. macOS does not include this directory in the
# default PATH, so without these lines no brew-installed program is found.
# The paths do not exist on Linux, where they are harmless, in the same way
# as the CUDA path above on macOS.
PATH=/opt/homebrew/bin
PATH=/opt/homebrew/sbin

[export]
GPG_TTY=$(tty)
SSH_AUTH_SOCK=$HOME/.ssh/ssh_auth_sock

[default]
COLORTERM=truecolor

[alias]
cu=cursor-agent
claude=env GIT_CONFIG_GLOBAL=$HOME/.gitconfig.local claude
cl=claude
clr=claude --resume
clc=claude --continue
clp=claude -p --model haiku
py=python
py3=python3
pym=python -m
pyc=python -c
tml=tm -l
